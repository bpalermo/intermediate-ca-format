# What buf checks in the protos. buf does not compile or generate anything
# here: Bazel does. //intermediateca/v1:secret_proto_lint_test runs the lint
# rules and scripts/proto-breaking.sh the breaking ones.
version: v2
lint:
  use:
    - STANDARD
    # Every message and field carries a comment: the comments are the
    # reference documentation.
    - COMMENTS
breaking:
  use:
    # The format is a contract between writers and readers that are released
    # separately and read each other's data for years, as binary or as JSON:
    # nothing renumbered, retyped, renamed or deleted. A change that needs one
    # of those is a new format version (intermediateca/v2), not an edit.
    - WIRE_JSON
